{% load chess_extras %}{% with g=games_by_id|get:ex.game_id %}{% if g %}<a class="chip" href="{% url 'analyzer:game_detail' ex.game_id %}?coup={{ ex.ply }}" title="Ouvrir la position dans l'analyse">{% icon "eye" %}<span>{{ g.played_at|date:"d/m" }} · {{ g.opponent }}</span><span class="mono">{{ ex.n }}{% if ex.ply|divisibleby:2 %}.{% else %}…{% endif %}{{ ex.san|san }}</span>{% if ex.loss %}<span class="chip-loss">−{{ ex.loss|num:0 }}</span>{% endif %}</a>{% endif %}{% endwith %}
